# Desenvolvimento em Docker com recarga automática (usado pelo "start_escolar dev").
# Soma-se ao docker-compose.yml: o código da pasta é montado nos containers, então cada
# arquivo salvo aparece na hora em http://localhost:3002, sem rebuild.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# No Windows o Docker não recebe os avisos de "arquivo mudou" da pasta montada,
# por isso os observadores de arquivos usam polling.
services:
  api:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backend/app:/app/app

  app:
    image: node:22-alpine
    build: !reset null
    working_dir: /app
    # Reinstala as dependências só quando o package-lock.json muda.
    command:
      - sh
      - -c
      - >-
        (cmp -s package-lock.json node_modules/.lock-instalado || (npm ci --no-audit --no-fund && cp package-lock.json node_modules/.lock-instalado))
        && npx next dev --webpack -H 0.0.0.0 -p 3000
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules   # dependências ficam no Linux, não na pasta do Windows
      - next_cache:/app/.next

volumes:
  node_modules:
  next_cache:
